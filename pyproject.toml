[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scarecrow-pipeline"
version = "0.1.0"
description = "Headless VN character posing, lighting, and compositing pipeline"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "Pillow>=10.0"]

[project.optional-dependencies]
vision = ["opencv-python>=4.8"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["scarecrow_pipeline*"]
